name: v0.3 quality gates

on:
  push:
    branches: [develop/v0.3]
  pull_request:
    branches: [develop/v0.3]

permissions:
  contents: read

jobs:
  unit-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: ci_postgres_local_only
          POSTGRES_DB: avm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout v0.1 main as separate baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-v01
      - name: Checkout v0.2 as independent baseline
        uses: actions/checkout@v4
        with:
          ref: develop/v0.2
          path: baseline-v02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Static syntax and shell validation
        run: |
          python -m compileall -q avm scripts tests
          bash -n scripts/install.sh scripts/backup.sh scripts/restore.sh
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Provision throwaway PostgreSQL CI roles
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:ci_postgres_local_only@127.0.0.1:5432/avm',
                               autocommit=True) as conn:
              conn.execute("CREATE ROLE avm_app LOGIN PASSWORD 'ci_app_local_only'")
              conn.execute("CREATE ROLE avm_reader LOGIN PASSWORD 'ci_reader_local_only'")
              conn.execute("ALTER DATABASE avm OWNER TO avm_app")
          print('CI database roles provisioned')
          PY
      - name: Integration test PostgreSQL review and read-only reporting views
        env:
          AVM_TEST_POSTGRES_URL: postgresql+psycopg://avm_app:ci_app_local_only@127.0.0.1:5432/avm
        run: python -m pytest -q tests/test_postgres_mapping_review.py tests/test_postgres_v03.py
      - name: Resolve v0.3 Compose configuration (no containers started)
        run: |
          python scripts/prepare_env.py --mode demo
          cp config/application.example.yaml config/application.yaml
          mkdir -p secrets/certs secrets/tls
          : > secrets/manageengine_token
          cp baseline-v01/example.env baseline-v01/.env
          sed -i 's/CHANGE_ME_[A-Z_]*/ci-dummy-credential/g' baseline-v01/.env
          cp baseline-v01/config/application.example.yaml baseline-v01/config/application.yaml
          mkdir -p baseline-v01/secrets/certs baseline-v01/secrets/tls
          : > baseline-v01/secrets/manageengine_token
          cp baseline-v02/example.env baseline-v02/.env
          python - <<'PY'
          from pathlib import Path
          path=Path('baseline-v02/.env')
          path.write_text(path.read_text().replace('\\n', '\n'))
          PY
          sed -i 's/CHANGE_ME_[A-Z_]*/ci-dummy-credential/g' baseline-v02/.env
          cp baseline-v02/config/application.example.yaml baseline-v02/config/application.yaml
          mkdir -p baseline-v02/secrets/certs baseline-v02/secrets/tls
          : > baseline-v02/secrets/manageengine_token
          docker compose config --quiet
          docker compose --profile setup config --quiet
          docker compose config --format json | python -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data["name"] == "assetvuln-monitor-v03", "wrong Compose project namespace"
          published = data["services"]["nginx"]["ports"]
          assert len(published) == 1
          assert str(published[0]["published"]) == "8445", "v0.3 port collision"
          assert published[0]["host_ip"] == "127.0.0.1", "unexpected public bind"
          print("PASS: isolated project and default HTTPS binding")
          '
      - name: Compare actual v0.1 and v0.3 Compose resources (read-only)
        run: python scripts/check_compose_isolation.py --baseline-dir baseline-v01 --candidate-dir .
      - name: Compare actual v0.2 and v0.3 Compose resources (read-only)
        run: python scripts/check_compose_isolation.py --baseline-dir baseline-v02 --candidate-dir .
