name: assetvuln-monitor

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: avm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run ./install.sh first}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?Run ./install.sh first}
      MB_DB_PASSWORD: ${MB_DB_PASSWORD:?Run ./install.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avm"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [backend]
    security_opt: [no-new-privileges:true]

  worker:
    # Match the host file owner so the unprivileged process can read mode-0600 token/config.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    command: ["python", "-m", "avm.worker"]
    environment:
      AVM_CONFIG: /opt/avm/config/application.yaml
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run ./install.sh first}
    volumes:
      - ./config/application.yaml:/opt/avm/config/application.yaml:ro
      - ./config/product-mappings.yaml:/opt/avm/config/product-mappings.yaml:ro
      - ./secrets/manageengine_token:/run/secrets/manageengine_token:ro
      - ./secrets/certs:/opt/avm/certs:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "avm.health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  metabase:
    image: metabase/metabase:v0.63.19
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: mb_user
      MB_DB_PASS: ${MB_DB_PASSWORD:?Run ./install.sh first}
      MB_SITE_URL: ${PUBLIC_URL:-https://localhost:8443}
      MB_LOAD_SAMPLE_CONTENT: 'false'
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks: [backend, frontend]
    security_opt: [no-new-privileges:true]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./secrets/tls/tls.key:/etc/nginx/tls/tls.key:ro
    depends_on:
      metabase: {condition: service_healthy}
    networks: [frontend]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [setup]
    command: ["python", "-m", "avm.bootstrap"]
    environment:
      AVM_CONFIG: /opt/avm/config/application.yaml
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run ./install.sh first}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?Run ./install.sh first}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@example.local}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?Run ./install.sh first}
      METABASE_INTERNAL_URL: http://metabase:3000
    depends_on:
      postgres: {condition: service_healthy}
      worker: {condition: service_healthy}
      metabase: {condition: service_healthy}
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  frontend:
    internal: true
  egress:
    driver: bridge
